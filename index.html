<!DOCTYPE html>
<html>

<head>

<title>My Music</title>

<link rel="apple-touch-icon" href="icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>

body{
margin:0;
height:100vh;

background:url('bg.jpg');
background-size:cover;
background-repeat:no-repeat;
background-position:center;

display:flex;
justify-content:center;
align-items:center;

font-family:sans-serif;
color:white;
}

.box{
width:300px;

padding:30px;
padding-bottom:50px;

background:rgba(0,0,0,0.5);

border-radius:20px;

backdrop-filter:blur(10px);

text-align:center;

overflow:hidden;
}

audio{
width:100%;
height:50px;
display:block;
margin-top:20px;
}

</style>

</head>

<body>

<div class="box">

<h1>My Music</h1>

<p>Favorite Song</p>

<audio controls>
<source src="song.mp3">
</audio>

</div>

</body>

</html>
