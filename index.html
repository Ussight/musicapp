<!DOCTYPE html>
<html>

<head>

<title>My Music</title>

<link rel="apple-touch-icon" href="icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
height:100vh;

background:#121212;

display:flex;
justify-content:center;
align-items:center;

font-family:sans-serif;
color:white;
}

.player{

width:320px;

background:#181818;

border-radius:25px;

padding:25px;

box-shadow:0 0 30px rgba(0,0,0,0.5);

text-align:center;
}

.cover{
width:220px;
height:220px;

margin:auto;

border-radius:20px;

background:url('cover.jpg');
background-size:cover;
background-position:center;

box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

h1{
font-size:28px;
margin-top:25px;
margin-bottom:10px;
}

p{
color:#b3b3b3;
margin-bottom:25px;
}

audio{
width:100%;
height:50px;
display:block;
margin-top:20px;
}

</style>

</head>

<body>

<div class="player">

<div class="cover"></div>

<h1>Favorite Song</h1>

<p>My Music App</p>

<audio controls>
<source src="song.mp3">
</audio>

</div>

</body>

</html>
